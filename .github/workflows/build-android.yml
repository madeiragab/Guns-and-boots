name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Buildozer)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-venv openjdk-11-jdk git zip unzip \
            zlib1g-dev libncurses5 libncurses5-dev libffi-dev libssl-dev \
            libsqlite3-dev libjpeg-dev build-essential autoconf automake libtool pkg-config \
            libgl1-mesa-dev libgles2-mesa-dev curl

      - name: Install Android SDK command-line tools
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline.zip
          unzip -q cmdline.zip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ || true
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-30" "build-tools;30.0.3" "ndk;21.4.7075529"
        shell: bash

      - name: Configure environment for Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user cython
          python3 -m pip install --user buildozer
          echo "::add-path::${HOME}/.local/bin"

      - name: Show buildozer version
        run: ~/.local/bin/buildozer --version || buildozer --version

      - name: Run Buildozer (android debug)
        # This step runs the build; it may take a long time on first run
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          PATH: ${{ runner.temp }}/android-sdk/cmdline-tools/latest/bin:${HOME}/.local/bin:${{ env.PATH }}
        run: |
          # Ensure buildozer.spec exists; user should have configured requirements and package name
          if [ ! -f buildozer.spec ]; then
            echo 'No buildozer.spec found — aborting.'
            exit 1
          fi
          ~/.local/bin/buildozer android debug || buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guns-and-boots-apk
          path: |
            bin/*.apk
            bin/*/*.apk
